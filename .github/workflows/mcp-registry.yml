name: MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) as
# io.github.<owner>/the-real-bitwarden-mcp.
#
#   workflow_call      from release.yml, after npm-publish succeeded
#                      (stable versions only)
#   workflow_dispatch  by hand for an existing release tag, e.g. to retry a
#                      failed publish
#
# Both check out the tag itself, so the published server.json is the one
# released with that version, never a newer one from the branch the run
# was started from. Its version must equal the tag version.
#
# The only package is the npm package the-real-bitwarden-mcp. The registry accepts the npm entry only when npm
# serves that version with an mcpName equal to the server name, so the
# run checks npm first:
#   npm-published true   the caller has just published the version; the
#                        run waits until npm serves it and fails if it
#                        never does
#   npm-published false  npm is checked once; the run fails when npm does
#                        not serve the version with the right mcpName
#                        (versions before 0.2.0 carry no mcpName)
# A registry version is permanent: when the version is already listed,
# the run ends without publishing.
#
# Authentication is GitHub OIDC (no secret): the registry grants the
# io.github.<repository owner>/* namespace. mcp-publisher comes from the
# registry's GitHub release, pinned by version and SHA-256 (asset
# mcp-publisher_linux_amd64.tar.gz, value from that release's
# registry_<version>_checksums.txt). To upgrade, change both together.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to list, e.g. v1.2.3
        required: true
        type: string
      npm-published:
        description: The version was just published to npm; wait for it
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to list, e.g. v1.2.3
        required: true
        type: string
      npm-published:
        description: Wait for npm to serve the version instead of checking once
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      NPM_PUBLISHED: ${{ inputs.npm-published }}
      MCP_PUBLISHER_VERSION: v1.8.5
      MCP_PUBLISHER_SHA256: 2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812
    steps:
      - name: Tag must be a stable release tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not a stable release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: server.json of the tag must carry the tag version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="$(jq -r .name server.json)"
          case "$name" in
            "io.github.${GITHUB_REPOSITORY_OWNER}/"*) ;;
            *)
              echo "::error::server.json name $name is outside io.github.${GITHUB_REPOSITORY_OWNER}/."
              exit 1
              ;;
          esac
          found="$(jq -r '[.version] + [.packages[] | if .registryType == "npm" then .version else error("unexpected package type \(.registryType)") end] | unique | join(",")' server.json)"
          if [ "$found" != "$version" ]; then
            echo "::error::server.json versions ($found) do not match tag $TAG."
            exit 1
          fi
          cat server.json
      - name: npm must serve this version with the server name as mcpName
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          ident="$(jq -r '[.packages[] | select(.registryType == "npm")][0].identifier // empty' server.json)"
          if [ -z "$ident" ]; then
            echo "::error::server.json lists no npm package."
            exit 1
          fi
          version="$(jq -r .version server.json)"
          url="https://registry.npmjs.org/${ident}/${version}"
          # mcpName of the version on npm, empty when npm does not serve it.
          lookup() { curl --silent --fail --max-time 20 --retry 3 "$url" | jq -r '.mcpName // empty' || true; }
          found="$(lookup)"
          if [ "$NPM_PUBLISHED" = "true" ]; then
            # A fresh publish can take a few minutes to show up.
            for _ in $(seq 1 30); do
              [ "$found" = "$name" ] && break
              sleep 10
              found="$(lookup)"
            done
          fi
          if [ "$found" != "$name" ]; then
            echo "::error::npm does not serve ${ident}@${version} with mcpName ${name} (got '${found}')."
            exit 1
          fi
      - name: Skip a version the registry already lists
        id: listed
        run: |
          set -euo pipefail
          name="$(jq -r '.name | @uri' server.json)"
          version="$(jq -r '.version | @uri' server.json)"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 --retry 3 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/${version}")"
          case "$code" in
            200)
              echo "::notice::$TAG is already listed in the MCP Registry; nothing to publish."
              echo "listed=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "listed=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::MCP Registry lookup returned HTTP $code."
              exit 1
              ;;
          esac
      - name: Install mcp-publisher (pinned version and SHA-256)
        if: steps.listed.outputs.listed == 'false'
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive"
          ./mcp-publisher --version
      - name: Log in with GitHub OIDC
        if: steps.listed.outputs.listed == 'false'
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: steps.listed.outputs.listed == 'false'
        run: ./mcp-publisher publish server.json
