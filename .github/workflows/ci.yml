name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so new advisories (npm audit) and a broken toolchain show
  # up even when nobody pushes.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # release.yml runs this whole workflow on the tag commit before it
  # builds anything, so a release passes the same gates as main.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this
  # workflow, so a release run never cancels a CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported line (engines >=22.12); 24 is the
        # production runtime; 26 is current.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - name: Built dist/index.js over stdio (every protocol revision, tool contract, version)
        env:
          STDIO_PROBE_BUILT: "1"
        run: npx vitest run tests/stdio-probe.test.ts
      - name: Tool contract (names, required lists, properties) and protocol versions
        run: npm run test:contract

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Runtime dependencies must have no known advisories
        run: npm audit --omit=dev --audit-level=low

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt of the GitHub release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, verified checksum)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
